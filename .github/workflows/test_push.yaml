name: Kubernetes FIPS

on:
  push:
    branches:
      - main
      - master

jobs:
  build-k8s-versions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Read build args
        id: build-args
        run: echo "args=$(cat ./fips/build-args.txt)" >> $GITHUB_OUTPUT

      - name: Build and push k8s full image
        id: pushfull
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64
          file: ./fips/Dockerfile.full
          tags: ghcr.io/hidalgopl/kubernetes:v1.33.3-fips-full
          build-args: |
            ${{ steps.build-args.outputs.args }}


